[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunkablation"
version = "1.0.0"
description = "Attribute a performance patch's measured saving to its individual hunks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
hunkablation = "hunkablation.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["hunkablation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
